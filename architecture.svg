<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-label="ClinSaar AI system architecture"><style>text{font-family:Arial,sans-serif;fill:#102a43}.t{font-size:16px;font-weight:700}.s{font-size:13px;fill:#526b7d}.h{font-size:25px;font-weight:800}.box{fill:#fff;stroke:#b8d2d8;stroke-width:2}.teal{fill:#e7f8f5;stroke:#087e8b;stroke-width:2}.navy{fill:#0b3954}.white{fill:#fff}.line{stroke:#087e8b;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#087e8b"/></marker></defs><rect width="1400" height="790" fill="#f5f9fb"/><text x="65" y="70" class="h">ClinSaar AI — safety-first OPD intake architecture</text><text x="65" y="98" class="s">Prototype design: synthetic data only · no diagnosis or treatment generation · every AI output requires clinician verification</text><rect x="70" y="160" width="260" height="180" rx="18" class="teal"/><text x="95" y="200" class="t">Patient Kiosk</text><text x="95" y="230" class="s">Hindi + English interface</text><text x="95" y="254" class="s">Voice / guided form</text><text x="95" y="278" class="s">Document capture</text><text x="95" y="308" class="s">Accessibility-first touch UI</text><rect x="445" y="130" width="300" height="250" rx="18" class="box"/><text x="470" y="170" class="t">Clinical Intake Orchestrator</text><text x="470" y="205" class="s">Field normalization</text><text x="470" y="231" class="s">Source & confidence labelling</text><text x="470" y="257" class="s">Consent / minimum-data boundary</text><text x="470" y="283" class="s">Verification state machine</text><text x="470" y="330" class="s">AI draft ≠ clinical decision</text><rect x="860" y="100" width="260" height="120" rx="18" class="teal"/><text x="885" y="140" class="t">AI adapters</text><text x="885" y="170" class="s">ASR / translation (future)</text><text x="885" y="195" class="s">OCR extraction (future)</text><rect x="860" y="290" width="260" height="120" rx="18" class="teal"/><text x="885" y="330" class="t">Evidence layer</text><text x="885" y="360" class="s">Original document reference</text><text x="885" y="385" class="s">Patient statement / confidence</text><rect x="1190" y="190" width="150" height="180" rx="18" class="box"/><text x="1214" y="230" class="t">Doctor</text><text x="1214" y="260" class="s">Queue</text><text x="1214" y="285" class="s">Edit</text><text x="1214" y="310" class="s">Verify</text><text x="1214" y="335" class="s">Export</text><line x1="330" y1="250" x2="445" y2="250" class="line"/><line x1="745" y1="205" x2="860" y2="160" class="line"/><line x1="745" y1="290" x2="860" y2="350" class="line"/><line x1="1120" y1="245" x2="1190" y2="270" class="line"/><rect x="250" y="505" width="900" height="160" rx="18" class="navy"/><text x="280" y="545" class="t white">Future interoperable record layer — clearly labelled as prototype, not a live ABDM connection</text><text x="280" y="580" class="s" fill="#dff7f4">FHIR Patient · Encounter · Observation · DocumentReference · Composition</text><text x="280" y="612" class="s" fill="#dff7f4">Consent-aware API boundary · Role-based access · Audit event model · Synthetic/demo data seed</text><line x1="600" y1="380" x2="600" y2="505" class="line"/></svg>
