<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">ClinSaar AI prototype architecture</title><desc id="desc">A safety-first patient intake workflow from kiosk through simulated AI assistance, confirmation, clinician verification and future FHIR interoperability.</desc><style>text{font-family:Arial,sans-serif;fill:#102a43}.h{font-size:26px;font-weight:800}.t{font-size:16px;font-weight:700}.s{font-size:13px;fill:#526b7d}.box{fill:#fff;stroke:#b8d2d8;stroke-width:2}.demo{fill:#e7f8f5;stroke:#087e8b;stroke-width:2}.future{fill:#fff8eb;stroke:#d79831;stroke-width:2}.navy{fill:#0b3954}.white{fill:#fff}.line{stroke:#087e8b;stroke-width:3;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#087e8b"/></marker></defs><rect width="1400" height="800" fill="#f5f9fb"/><text x="65" y="62" class="h">ClinSaar AI — safety-first OPD intake architecture</text><text x="65" y="91" class="s">Static GitHub Pages prototype · synthetic data only · no diagnosis or treatment · clinician verification required</text><rect x="55" y="150" width="230" height="180" rx="18" class="demo"/><text x="80" y="190" class="t">Patient Kiosk</text><text x="80" y="220" class="s">Hindi / English</text><text x="80" y="244" class="s">Voice / text / documents</text><text x="80" y="268" class="s">Large touch controls</text><text x="80" y="298" class="s">DEMO: local synthetic flow</text><rect x="365" y="150" width="260" height="180" rx="18" class="demo"/><text x="390" y="190" class="t">Input + Confirmation</text><text x="390" y="220" class="s">Patient statement retained</text><text x="390" y="244" class="s">Evidence label + confidence</text><text x="390" y="268" class="s">Patient confirms draft</text><text x="390" y="298" class="s">No real data is collected</text><rect x="705" y="125" width="300" height="230" rx="18" class="future"/><text x="730" y="166" class="t">AI Assistance Layer</text><text x="730" y="196" class="s">ASR + translation</text><text x="730" y="220" class="s">Statement normalization</text><text x="730" y="244" class="s">Structured-history draft</text><text x="730" y="268" class="s">OCR extraction</text><text x="730" y="310" class="s">FUTURE: consented server-side adapters</text><text x="730" y="332" class="s">Demo simulation is visibly labelled</text><rect x="1085" y="150" width="250" height="180" rx="18" class="box"/><text x="1110" y="190" class="t">Doctor Cockpit</text><text x="1110" y="220" class="s">Queue + source timeline</text><text x="1110" y="244" class="s">Edit local demo draft</text><text x="1110" y="268" class="s">Verify clinician review</text><text x="1110" y="298" class="s">AI draft ≠ clinical decision</text><line x1="285" y1="240" x2="365" y2="240" class="line"/><line x1="625" y1="240" x2="705" y2="240" class="line"/><line x1="1005" y1="240" x2="1085" y2="240" class="line"/><rect x="260" y="500" width="880" height="170" rx="18" class="navy"/><text x="290" y="545" class="t white">FHIR-ready interoperability layer — prototype export, not live ABDM integration</text><text x="290" y="580" class="s" fill="#dff7f4">Patient · Encounter · Observation · DocumentReference · Composition</text><text x="290" y="612" class="s" fill="#dff7f4">Future production: consent, authenticated roles, audit events, encryption and minimum-necessary retention</text><line x1="1210" y1="330" x2="1000" y2="500" class="line"/></svg>
